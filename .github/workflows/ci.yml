name: CI

on:
  push:
    branches: [main, android-app]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: 类型检查 + 排盘回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 仓库已提交 package-lock.json：按锁定版本安装，并开 npm 缓存
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 排盘引擎回归
        run: npm test

      - name: 倪师课程案例与规则回归
        run: npm run test:ni

      - name: 生产构建
        run: npm run build

      - name: 安装测试浏览器
        run: npx playwright install --with-deps chromium

      - name: 表单与运限交互回归
        run: npm run test:e2e

      - name: 离线应用资源构建
        run: npm run mobile:build

      - name: 离线应用回归
        run: npm run mobile:test

      - name: AI 命盘资料回归
        run: npm run test:ai
